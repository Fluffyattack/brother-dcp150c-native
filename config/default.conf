# Default Brother DCP-150C settings. CUPS creates a private copy for each job.
[DCP150C]
Media=Plain
Resolution=600
RResolution=Normal
BiDirPrint=ON
MirrorPrint=OFF
PaperType=A4
PaperThick=Regular
PaperSource=AUTO
Copies=1
ColorOrMono=Color
Collate=OFF
Document=Photo
ColorMatch=Natural
HalfTone=Diffusion
ColorEnhance=OFF
SlowDrying=OFF
Brightness=0
Contrast=0
RedKey=0
GreenKey=0
BlueKey=0
Language=us
